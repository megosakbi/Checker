<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wklej → Wyślij</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      margin: 0;
      padding: 2rem;
      max-width: 700px;
      margin: 0 auto;
    }
    h1 { color: #58a6ff; }
    textarea {
      width: 100%;
      min-height: 160px;
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 15px;
      resize: vertical;
      margin: 1rem 0 1.5rem;
    }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 0.8rem 1.8rem;
      font-size: 1.1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.15s;
    }
    button:hover { background: #2ea043; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #info {
      margin-top: 1.5rem;
      min-height: 1.5rem;
      font-weight: 500;
    }
    .ok    { color: #3fb950; }
    .error { color: #f85149; }
  </style>
</head>
<body>

<h1>Wklej i wyślij</h1>

<textarea id="tresc" placeholder="Wklej tutaj tekst, kod, logi..."></textarea>

<button id="btn">Wyślij</button>

<div id="info"></div>

<script>
const ENDPOINT = "/api/wyslij";           // ← Twój endpoint na Vercel
const btn = document.getElementById("btn");
const txt = document.getElementById("tresc");
const info = document.getElementById("info");

btn.addEventListener("click", async () => {
  const tekst = txt.value.trim();
  if (!tekst) {
    pokaz("Nic nie wpisano", "error");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Wysyłam...";
  pokaz("Trwa wysyłanie...", "");

  try {
    const res = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tekst })
    });

    if (res.ok) {
      pokaz("Wysłano pomyślnie ✓", "ok");
      txt.value = "";
    } else {
      const err = await res.text().catch(() => "");
      pokaz(`Błąd: ${res.status} ${err.slice(0,80)}`, "error");
    }
  } catch (err) {
    pokaz(`Połączenie nie udało się: ${err.message}`, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Wyślij";
  }
});

function pokaz(tresc, klasa = "") {
  info.textContent = tresc;
  info.className = klasa;
}
</script>

</body>
</html>
