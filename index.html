<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Release something</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f11;
      color: #e0e0e0;
      padding: 30px;
      max-width: 640px;
      margin: 0 auto;
    }
    h1 { color: #00d4ff; }
    textarea {
      width: 100%;
      min-height: 180px;
      background: #1a1a1f;
      color: #eee;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 14px;
      font-family: 'Consolas', monospace;
      font-size: 15px;
      resize: vertical;
      margin: 12px 0 20px;
    }
    button {
      background: #0066ff;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 17px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #0055dd; }
    button:active { transform: scale(0.97); }
    #status {
      margin-top: 20px;
      min-height: 24px;
      font-weight: 500;
    }
    .success { color: #00ff9d; }
    .error   { color: #ff4d4d; }
  </style>
</head>
<body>

<h1>Release cośtam</h1>

<textarea id="content" placeholder="Wklej tutaj co chcesz wysłać...&#10;może być kod, logi, мем, co tylko chcesz"></textarea>

<button id="sendBtn">Release →</button>

<div id="status"></div>

<script>
// ────────────────────────────────────────────────
// Zmień tę linię na swój prawdziwy webhook!
const WEBHOOK_URL = "https://twoj-projekt.vercel.app/api/webhook-super-secret-xyz123";
// ────────────────────────────────────────────────

const textarea = document.getElementById("content");
const btn = document.getElementById("sendBtn");
const statusDiv = document.getElementById("status");

btn.addEventListener("click", async () => {
  const text = textarea.value.trim();

  if (!text) {
    showStatus("Nic nie wpisałeś :(", "error");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Wysyłam...";
  showStatus("Trwa wysyłanie...", "neutral");

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        content: text,
        timestamp: new Date().toISOString(),
        // możesz dodać więcej pól, np.:
        // userAgent: navigator.userAgent,
        // referrer: document.referrer || "direct",
      })
    });

    if (res.ok) {
      showStatus("Wysłano pomyślnie! 🎉", "success");
      textarea.value = ""; // opcjonalnie czyścimy pole
    } else {
      const errText = await res.text().catch(() => "");
      showStatus(`Błąd serwera: ${res.status} ${errText.slice(0,100)}`, "error");
    }
  } catch (err) {
    showStatus(`Błąd połączenia: ${err.message}`, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Release →";
  }
});

function showStatus(msg, type = "neutral") {
  statusDiv.textContent = msg;
  statusDiv.className = type; // success / error / neutral
}
</script>

</body>
</html>
