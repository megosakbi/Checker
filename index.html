<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Roblox – nazwa z .ROBLOSECURITY</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; max-width: 600px; margin: auto; }
    textarea { width: 100%; height: 90px; font-family: monospace; }
    button { padding: 12px 24px; font-size: 16px; margin: 10px 0; }
    #result { margin-top: 20px; padding: 15px; border: 2px solid #444; border-radius: 6px; }
    .error { color: #e74c3c; }
    .success { color: #2ecc71; }
  </style>
</head>
<body>

<h2>Pobierz swoją nazwę użytkownika Roblox z cookie .ROBLOSECURITY</h2>
<p><strong>Uwaga:</strong> cookie nigdy nie wysyłaj nikomu!</p>

<textarea id="cookieInput" placeholder="Wklej tutaj wartość .ROBLOSECURITY (bez nazwy cookie, tylko długi ciąg znaków)"></textarea>

<br>
<button onclick="sprawdz()">Sprawdź → Pokaż nazwę</button>

<div id="result"></div>

<script>
async function sprawdz() {
  const cookieValue = document.getElementById("cookieInput").value.trim();
  const resultDiv = document.getElementById("result");

  if (!cookieValue) {
    resultDiv.innerHTML = '<span class="error">Wklej cookie!</span>';
    return;
  }

  resultDiv.innerHTML = 'Czekaj...';

  try {
    // Najpierw pobieramy X-CSRF-Token (większość endpointów go wymaga w 2025/2026)
    const tokenRes = await fetch("https://auth.roblox.com/v2/logout", {
      method: "POST",
      credentials: "omit",
      headers: {
        "Cookie": `.ROBLOSECURITY=${cookieValue}`,
        "Content-Type": "application/json"
      }
    });

    const csrfToken = tokenRes.headers.get("x-csrf-token");
    if (!csrfToken) {
      throw new Error("Nie udało się pobrać X-CSRF-Token");
    }

    // Teraz pobieramy info o zalogowanym użytkowniku
    const userRes = await fetch("https://users.roblox.com/v1/users/authenticated", {
      method: "GET",
      credentials: "omit",
      headers: {
        "Cookie": `.ROBLOSECURITY=${cookieValue}`,
        "X-CSRF-TOKEN": csrfToken,
        "Accept": "application/json"
      }
    });

    if (!userRes.ok) {
      if (userRes.status === 401) {
        throw new Error("Cookie jest nieprawidłowe lub wygasło (401 Unauthorized)");
      }
      throw new Error(`Błąd HTTP: ${userRes.status}`);
    }

    const data = await userRes.json();

    resultDiv.innerHTML = `
      <span class="success">Zalogowany jako:</span><br><br>
      <b>Nazwa użytkownika:</b> ${data.name}<br>
      <b>Display Name:</b> ${data.displayName}<br>
      <b>User ID:</b> ${data.id}
    `;
  } catch (err) {
    resultDiv.innerHTML = `<span class="error">Błąd: ${err.message}</span>`;
    console.error(err);
  }
}
</script>

</body>
</html>
